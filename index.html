<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Lyrics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    font-size: 0.85rem;
    color: #777;
  }
  #pairScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #pairScreen p { font-size: 1.3rem; margin-bottom: 12px; }
  #codeInput {
    font-size: 1.5rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    text-align: center;
  }
  #codeSubmit {
    font-size: 1.3rem;
    padding: 10px 20px;
    margin-top: 12px;
    border-radius: 8px;
    border: none;
    background: #e82127;
    color: #fff;
  }
  #mainScreen {
    display: none;
    height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #meta { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  #albumArt {
    width: 88px;
    height: 88px;
    border-radius: 8px;
    object-fit: cover;
    background: #111;
    display: none;
  }
  #albumArt.visible { display: block; }
  #metaText { text-align: left; }
  #title { font-size: 2.1rem; font-weight: 700; }
  #artist { font-size: 1.3rem; color: #999; margin-top: 4px; }
  #lyricsSource { font-size: 0.8rem; color: #555; margin-top: 6px; }
  #lyricsBox {
    width: 100%;
    max-width: 900px;
    height: 60vh;
    overflow-y: auto;
    text-align: center;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #lyricsBox::-webkit-scrollbar { display: none; }
  .line {
    font-size: 1.7rem;
    line-height: 2.5rem;
    color: #555;
    transition: color 0.3s, font-size 0.3s;
    padding: 4px 16px;
  }
  .line.active {
    color: #fff;
    font-size: 2.1rem;
    font-weight: 700;
  }
  #syncControls {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    color: #999;
  }
  #syncControls button {
    font-size: 0.95rem;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
  }
  #syncOffsetValue { min-width: 56px; text-align: center; font-size: 0.9rem; }
  #retryLyricsButton {
    margin-top: 10px;
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #111;
    color: #999;
  }
</style>
</head>
<body>

<div id="status"></div>

<div id="pairScreen">
  <p>테슬라 가사 앱 페어링 코드를 입력하세요</p>
  <input id="codeInput" placeholder="예: a1b2c3d4e5f6" autocomplete="off" />
  <button id="codeSubmit">연결</button>
</div>

<div id="mainScreen">
  <div id="meta">
    <img id="albumArt" alt="" />
    <div id="metaText">
      <div id="title">-</div>
      <div id="artist"></div>
      <div id="lyricsSource"></div>
    </div>
  </div>
  <div id="lyricsBox"></div>
  <div id="syncControls">
    <button id="syncMinus">-0.5s</button>
    <span id="syncOffsetValue">0.0s</span>
    <button id="syncPlus">+0.5s</button>
    <button id="syncReset">리셋</button>
  </div>
  <button id="retryLyricsButton">다른 가사 찾기</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0xXKqBXsnGArW2Kp67I24stAXcRc0uzM",
  authDomain: "tesla-lyrics-14c87.firebaseapp.com",
  databaseURL: "https://tesla-lyrics-14c87-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesla-lyrics-14c87",
  storageBucket: "tesla-lyrics-14c87.firebasestorage.app",
  messagingSenderId: "662777813005",
  appId: "1:662777813005:web:2cfc6d793e1e647aec9d44"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const pairScreen = document.getElementById('pairScreen');
const mainScreen = document.getElementById('mainScreen');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const artistEl = document.getElementById('artist');
const lyricsSourceEl = document.getElementById('lyricsSource');
const albumArtEl = document.getElementById('albumArt');
const lyricsBox = document.getElementById('lyricsBox');
const syncOffsetValueEl = document.getElementById('syncOffsetValue');

let syncedLyrics = [];
let lastTrackKey = null;
let lastLyricsKey = null;
let activeIndex = -1;

// 로컬 보간용 상태: 마지막으로 받은 위치와 수신 시각을 기준으로
// 프레임마다 재생 위치를 추정해서 자연스럽게 스크롤한다.
let basePositionMs = 0;
let baseReceivedAt = 0;
let isPlaying = false;

// 사용자가 수동으로 조절하는 가사 싱크 보정값(ms). 기기/네트워크 지연을
// 보정하기 위한 값이라 브라우저에 저장해서 다음 방문 때도 유지한다.
let syncOffsetMs = parseInt(localStorage.getItem('syncOffsetMs') || '0', 10);

function updateSyncOffsetDisplay() {
  const seconds = syncOffsetMs / 1000;
  const sign = seconds > 0 ? '+' : '';
  syncOffsetValueEl.textContent = `${sign}${seconds.toFixed(1)}s`;
}

function setSyncOffset(ms) {
  syncOffsetMs = ms;
  localStorage.setItem('syncOffsetMs', String(syncOffsetMs));
  updateSyncOffsetDisplay();
}

document.getElementById('syncMinus').addEventListener('click', () => setSyncOffset(syncOffsetMs - 500));
document.getElementById('syncPlus').addEventListener('click', () => setSyncOffset(syncOffsetMs + 500));
document.getElementById('syncReset').addEventListener('click', () => setSyncOffset(0));
updateSyncOffsetDisplay();

document.getElementById('retryLyricsButton').addEventListener('click', () => {
  if (!currentCode) return;
  db.ref('nowplaying/' + currentCode).update({ retryRequestedAt: firebase.database.ServerValue.TIMESTAMP });
});

function startWithCode(code) {
  localStorage.setItem('pairingCode', code);
  pairScreen.style.display = 'none';
  mainScreen.style.display = 'flex';
  subscribe(code);
}

document.getElementById('codeSubmit').addEventListener('click', () => {
  const value = document.getElementById('codeInput').value.trim();
  if (value) startWithCode(value);
});
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('codeSubmit').click();
});

let currentCode = null;

function subscribe(code) {
  currentCode = code;
  const ref = db.ref('nowplaying/' + code);
  ref.on('value', (snap) => {
    const data = snap.val();
    if (!data) {
      statusEl.textContent = '연결됨 · 재생 대기 중';
      return;
    }
    render(data);
  }, (err) => {
    statusEl.textContent = '연결 오류: ' + err.message;
  });
}

function render(data) {
  const nothingPlaying = data.lyricsStatus === 'none';
  statusEl.textContent = nothingPlaying ? '재생 중인 곡이 없어요' : (data.isPlaying ? '재생 중' : '일시정지');
  titleEl.textContent = nothingPlaying ? '-' : (data.title || '-');
  artistEl.textContent = nothingPlaying ? '' : (data.artist || '');
  lyricsSourceEl.textContent = nothingPlaying ? '' : (data.lyricsSource ? `가사 출처: ${data.lyricsSource}` : '');

  if (data.albumArtUrl) {
    albumArtEl.src = data.albumArtUrl;
    albumArtEl.classList.add('visible');
  } else {
    albumArtEl.removeAttribute('src');
    albumArtEl.classList.remove('visible');
  }

  isPlaying = !!data.isPlaying;
  basePositionMs = data.positionMs || 0;
  baseReceivedAt = Date.now();

  const trackKey = (data.title || '') + '|' + (data.artist || '');
  // 제목/가수가 같아도 "검색 중 -> 완료"로 가사 내용 자체가 바뀔 수 있어서,
  // 곡이 바뀐 건지와 별개로 가사 상태(status/plain/synced)도 같이 봐야 한다.
  const lyricsKey = (data.lyricsStatus || '') + '|' + (data.plainLyrics ? 'p' : '') +
    '|' + (data.syncedLyrics ? Object.keys(data.syncedLyrics).length : 0);

  if (trackKey !== lastTrackKey || lyricsKey !== lastLyricsKey) {
    if (trackKey !== lastTrackKey) activeIndex = -1;
    lastTrackKey = trackKey;
    lastLyricsKey = lyricsKey;
    syncedLyrics = data.syncedLyrics ? Object.values(data.syncedLyrics) : [];
    renderLyricsList(data);
  }
}

function renderLyricsList(data) {
  lyricsBox.innerHTML = '';
  if (syncedLyrics.length > 0) {
    syncedLyrics.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.id = 'line-' + i;
      div.textContent = line.text || ' ';
      lyricsBox.appendChild(div);
    });
    addBottomSpacer();
  } else if (data.plainLyrics) {
    data.plainLyrics.split('\n').forEach((text) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = text || ' ';
      lyricsBox.appendChild(div);
    });
  } else if (data.lyricsStatus === 'searching') {
    lyricsBox.innerHTML = '<div class="line">가사 검색 중...</div>';
  } else if (data.lyricsStatus === 'none') {
    lyricsBox.innerHTML = '';
  } else {
    lyricsBox.innerHTML = '<div class="line">가사를 찾을 수 없어요</div>';
  }
}

// 하이라이트 줄이 가사 박스 높이의 이 비율 지점에 오도록 스크롤
const ACTIVE_LINE_OFFSET_RATIO = 0.6;

function scrollToLine(el) {
  const targetOffset = lyricsBox.clientHeight * ACTIVE_LINE_OFFSET_RATIO;
  const scrollTop = el.offsetTop - targetOffset + el.offsetHeight / 2;
  lyricsBox.scrollTo({ top: scrollTop, behavior: 'smooth' });
}

// 마지막 줄들은 스크롤할 콘텐츠가 부족해서 하이라이트 지점(위 비율)까지
// 끌어올릴 수 없고, 그만큼 위로 밀려 올라가 보인다. 실제 콘텐츠 아래에
// 빈 여백을 더해서 마지막 줄도 같은 위치에 고정되도록 한다.
function addBottomSpacer() {
  const spacer = document.createElement('div');
  spacer.style.height = (lyricsBox.clientHeight * (1 - ACTIVE_LINE_OFFSET_RATIO)) + 'px';
  lyricsBox.appendChild(spacer);
}

function estimatedPositionMs() {
  const base = isPlaying ? basePositionMs + (Date.now() - baseReceivedAt) : basePositionMs;
  return base + syncOffsetMs;
}

function tick() {
  if (syncedLyrics.length > 0) {
    const position = estimatedPositionMs();
    let idx = -1;
    for (let i = 0; i < syncedLyrics.length; i++) {
      if (syncedLyrics[i].timeMs <= position) idx = i;
      else break;
    }
    if (idx !== activeIndex) {
      activeIndex = idx;
      document.querySelectorAll('.line.active').forEach((el) => el.classList.remove('active'));
      if (idx >= 0) {
        const el = document.getElementById('line-' + idx);
        if (el) {
          el.classList.add('active');
          scrollToLine(el);
        }
      }
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const savedCode = localStorage.getItem('pairingCode');
const paramCode = new URLSearchParams(location.search).get('code');
const initialCode = paramCode || savedCode;
if (initialCode) {
  document.getElementById('codeInput').value = initialCode;
  startWithCode(initialCode);
}
</script>
</body>
</html>
