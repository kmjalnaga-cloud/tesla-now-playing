<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Lyrics</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  #status {
    position: fixed;
    top: 12px;
    right: 16px;
    font-size: 0.85rem;
    color: #777;
  }
  /* 폰 앱 응답 없음 / 인터넷 끊김 경고 */
  #status.stale { color: #e8a33d; font-weight: 700; }
  #pairScreen {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  #pairScreen p { font-size: 1.3rem; margin-bottom: 12px; }
  #codeInput {
    font-size: 1.5rem;
    padding: 10px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    text-align: center;
  }
  #codeSubmit {
    font-size: 1.3rem;
    padding: 10px 20px;
    margin-top: 12px;
    border-radius: 8px;
    border: none;
    background: #e82127;
    color: #fff;
  }
  #mainScreen {
    display: none;
    height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #meta { display: flex; align-items: center; gap: 20px; margin-bottom: 20px; }
  #albumArt {
    width: 88px;
    height: 88px;
    border-radius: 8px;
    object-fit: cover;
    background: #111;
    display: none;
  }
  #albumArt.visible { display: block; }
  #metaText { text-align: left; }
  #title { font-size: 2.1rem; font-weight: 700; }
  #artist { font-size: 1.3rem; color: #999; margin-top: 4px; }
  #lyricsSource { font-size: 0.8rem; color: #555; margin-top: 6px; }
  #lyricsBox {
    /* 줄의 offsetTop이 이 박스 기준으로 나오게 하는 기준점. 없으면 페이지 맨 위
       기준이라 하이라이트가 박스 위쪽 영역(제목 등)의 높이만큼 어긋나고,
       브라우저를 확대할수록 그 어긋남이 커진다. */
    position: relative;
    width: 100%;
    max-width: 900px;
    height: 60vh;
    overflow-y: auto;
    text-align: center;
    scroll-behavior: smooth;
    scrollbar-width: none;
  }
  #lyricsBox::-webkit-scrollbar { display: none; }
  /* --lyric-scale: "가-/가+" 버튼으로 바꾸는 가사 글자 배율 (기본 1) */
  .line {
    font-size: calc(1.7rem * var(--lyric-scale, 1));
    line-height: calc(2.5rem * var(--lyric-scale, 1));
    color: #555;
    transition: color 0.3s, font-size 0.3s;
    padding: 4px 16px;
  }
  .line.active {
    color: #fff;
    font-size: calc(2.1rem * var(--lyric-scale, 1));
    font-weight: 700;
  }
  #syncControls {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 16px;
    color: #999;
  }
  .controlDivider { width: 1px; height: 24px; background: #333; margin: 0 6px; }
  #fontScaleValue { min-width: 52px; text-align: center; font-size: 0.9rem; }
  #syncControls button {
    font-size: 0.95rem;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
  }
  #syncOffsetValue { min-width: 56px; text-align: center; font-size: 0.9rem; }
  #retryControls {
    margin-top: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  #retryLabel { font-size: 0.85rem; color: #777; }
  .retryButton {
    font-size: 0.9rem;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #111;
    color: #999;
  }

  /* 클릭/터치 피드백. 버튼 배경이 이미 거의 검정이라 "어두워지기"는 안 보여서,
     누른 순간 밝아졌다가 원래대로 돌아오는 방식으로 표시한다. */
  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    user-select: none;
    transition: transform 0.12s ease-out;
  }
  button:active { transform: scale(0.94); }
  @keyframes tapFlash {
    0%   { background: #484848; border-color: #999; transform: scale(0.92); }
    100% { background: #111;    border-color: #333; transform: scale(1); }
  }
  @keyframes tapFlashRed {
    0%   { background: #8c1217; transform: scale(0.92); }
    100% { background: #e82127; transform: scale(1); }
  }
  button.tapped { animation: tapFlash 0.35s ease-out; }
  #codeSubmit.tapped { animation-name: tapFlashRed; }
</style>
</head>
<body>

<div id="status"></div>

<div id="pairScreen">
  <p>테슬라 가사 앱 페어링 코드를 입력하세요</p>
  <input id="codeInput" placeholder="예: a1b2c3d4e5f6" autocomplete="off" />
  <button id="codeSubmit">연결</button>
</div>

<div id="mainScreen">
  <div id="meta">
    <img id="albumArt" alt="" />
    <div id="metaText">
      <div id="title">-</div>
      <div id="artist"></div>
      <div id="lyricsSource"></div>
    </div>
  </div>
  <div id="lyricsBox"></div>
  <div id="syncControls">
    <button id="syncMinus">-0.5s</button>
    <span id="syncOffsetValue">0.0s</span>
    <button id="syncPlus">+0.5s</button>
    <button id="syncReset">리셋</button>
    <span class="controlDivider"></span>
    <button id="fontMinus" aria-label="가사 글자 작게">가−</button>
    <span id="fontScaleValue">100%</span>
    <button id="fontPlus" aria-label="가사 글자 크게">가+</button>
  </div>
  <div id="retryControls">
    <span id="retryLabel">다른 소스로 찾기:</span>
    <button class="retryButton" data-source="LRCLIB">LRCLIB</button>
    <button class="retryButton" data-source="NetEase">NetEase</button>
    <button class="retryButton" data-source="lyrics.ovh">lyrics.ovh</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyA0xXKqBXsnGArW2Kp67I24stAXcRc0uzM",
  authDomain: "tesla-lyrics-14c87.firebaseapp.com",
  databaseURL: "https://tesla-lyrics-14c87-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "tesla-lyrics-14c87",
  storageBucket: "tesla-lyrics-14c87.firebasestorage.app",
  messagingSenderId: "662777813005",
  appId: "1:662777813005:web:2cfc6d793e1e647aec9d44"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

const pairScreen = document.getElementById('pairScreen');
const mainScreen = document.getElementById('mainScreen');
const statusEl = document.getElementById('status');
const titleEl = document.getElementById('title');
const artistEl = document.getElementById('artist');
const lyricsSourceEl = document.getElementById('lyricsSource');
const albumArtEl = document.getElementById('albumArt');
const lyricsBox = document.getElementById('lyricsBox');
const syncOffsetValueEl = document.getElementById('syncOffsetValue');

let syncedLyrics = [];
let lastTrackKey = null;
let lastLyricsKey = null;
let activeIndex = -1;

// 로컬 보간용 상태: 마지막으로 받은 위치와 수신 시각을 기준으로
// 프레임마다 재생 위치를 추정해서 자연스럽게 스크롤한다.
let basePositionMs = 0;
let baseReceivedAt = 0;
let isPlaying = false;

// 사용자가 수동으로 조절하는 가사 싱크 보정값(ms). 기기/네트워크 지연을
// 보정하기 위한 값이라 브라우저에 저장해서 다음 방문 때도 유지한다.
let syncOffsetMs = parseInt(localStorage.getItem('syncOffsetMs') || '0', 10);

function updateSyncOffsetDisplay() {
  const seconds = syncOffsetMs / 1000;
  const sign = seconds > 0 ? '+' : '';
  syncOffsetValueEl.textContent = `${sign}${seconds.toFixed(1)}s`;
}

function setSyncOffset(ms) {
  syncOffsetMs = ms;
  localStorage.setItem('syncOffsetMs', String(syncOffsetMs));
  updateSyncOffsetDisplay();
}

document.getElementById('syncMinus').addEventListener('click', () => setSyncOffset(syncOffsetMs - 500));
document.getElementById('syncPlus').addEventListener('click', () => setSyncOffset(syncOffsetMs + 500));
document.getElementById('syncReset').addEventListener('click', () => setSyncOffset(0));
updateSyncOffsetDisplay();

// 가사 글자 크기. 브라우저 확대는 제목/버튼까지 같이 키워서 정작 가사 영역이
// 3~6줄로 줄어들기 때문에, 가사 글자만 키우는 배율을 따로 둔다. 브라우저에 저장.
const LYRIC_SCALES = [0.8, 1, 1.25, 1.5, 1.75, 2, 2.5, 3];
let lyricScale = parseFloat(localStorage.getItem('lyricScale') || '1');
if (!(lyricScale >= 0.5 && lyricScale <= 4)) lyricScale = 1;

function applyLyricScale() {
  document.documentElement.style.setProperty('--lyric-scale', String(lyricScale));
  document.getElementById('fontScaleValue').textContent = Math.round(lyricScale * 100) + '%';
}

function stepLyricScale(direction) {
  // 저장값이 프리셋과 정확히 안 맞아도 가장 가까운 프리셋에서 한 칸 이동한다.
  let nearest = 0;
  LYRIC_SCALES.forEach((s, i) => {
    if (Math.abs(s - lyricScale) < Math.abs(LYRIC_SCALES[nearest] - lyricScale)) nearest = i;
  });
  const next = Math.min(LYRIC_SCALES.length - 1, Math.max(0, nearest + direction));
  lyricScale = LYRIC_SCALES[next];
  localStorage.setItem('lyricScale', String(lyricScale));
  applyLyricScale();
  // 줄 높이가 바뀌어 하이라이트 줄 위치가 틀어졌으니 다시 맞춘다(tick이 처리).
  // 글자 크기 전환(0.3s) 중에는 줄바꿈이 달라질 수 있어서 끝난 뒤 한 번 더.
  activeIndex = -1;
  setTimeout(() => { activeIndex = -1; }, 350);
}

document.getElementById('fontMinus').addEventListener('click', () => stepLyricScale(-1));
document.getElementById('fontPlus').addEventListener('click', () => stepLyricScale(1));
applyLyricScale();

// 버튼을 누르면 잠깐 번쩍이게 한다(CSS의 tapFlash). 연속으로 눌러도 매번
// 처음부터 다시 재생되도록 클래스를 뺐다가 강제 리플로우 후 다시 붙인다.
// 클래스는 animationend 대신 타이머로 지운다: 버튼이 화면에 그려지지 않는
// 상태(탭이 가려짐, display:none 화면 전환)에서는 animationend가 오지 않아
// 클래스가 남고, 나중에 화면에 다시 나타날 때 뒤늦게 번쩍이기 때문이다.
document.addEventListener('click', (e) => {
  const btn = e.target.closest && e.target.closest('button');
  if (!btn) return;
  clearTimeout(btn.tapTimer);
  btn.classList.remove('tapped');
  void btn.offsetWidth;
  btn.classList.add('tapped');
  btn.tapTimer = setTimeout(() => btn.classList.remove('tapped'), 400);
});

document.querySelectorAll('.retryButton').forEach((btn) => {
  btn.addEventListener('click', () => {
    if (!currentCode) return;
    db.ref('nowplaying/' + currentCode + '/retryRequest').set({
      at: firebase.database.ServerValue.TIMESTAMP,
      source: btn.dataset.source
    });
  });
});

function startWithCode(code) {
  localStorage.setItem('pairingCode', code);
  pairScreen.style.display = 'none';
  mainScreen.style.display = 'flex';
  subscribe(code);
}

document.getElementById('codeSubmit').addEventListener('click', () => {
  const value = document.getElementById('codeInput').value.trim();
  if (value) startWithCode(value);
});
document.getElementById('codeInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('codeSubmit').click();
});

let currentCode = null;

function subscribe(code) {
  currentCode = code;
  const ref = db.ref('nowplaying/' + code);
  ref.on('value', (snap) => {
    const data = snap.val();
    if (!data) {
      lastData = null;
      setBaseStatus('연결됨 · 재생 대기 중');
      return;
    }
    render(data);
  }, (err) => {
    setBaseStatus('연결 오류: ' + err.message);
  });
}

// Firebase 서버 시계 - 이 기기 시계 (ms). 앱은 위치를 "서버 시각 기준으로
// 언제 쟀는지"(positionSampledAt)를 같이 보내므로, 브라우저를 곡 중간에 켰거나
// 푸시가 늦게 도착해도 그만큼을 더해서 지금 위치를 맞출 수 있다. 서로의 기기
// 시계가 달라도 둘 다 서버 시계로 환산하기 때문에 영향이 없다.
let serverOffsetMs = 0;
let serverOffsetKnown = false;
let lastData = null;
db.ref('.info/serverTimeOffset').on('value', (snap) => {
  serverOffsetMs = snap.val() || 0;
  serverOffsetKnown = true;
  if (lastData) applyPosition(lastData);
});

// 연결 상태 표시. 폰이 화면이 꺼진 채 절전으로 앱을 재우면 앱이 아무것도 안
// 보내는데, 그동안 화면엔 마지막 가사가 그대로 남아서 멈춘 줄 모르고 보게 된다.
// 앱은 재생 중이면 5초마다 푸시하므로, 그보다 한참 오래 조용하면 경고한다.
// 재생 중이 아닐 때(일시정지/없음)는 앱이 원래 푸시를 멈추니 경고하지 않는다.
const APP_SILENT_AFTER_MS = 25 * 1000;
const OFFLINE_WARN_AFTER_MS = 3 * 1000;
let baseStatusText = null;
let browserOfflineSince = null;

db.ref('.info/connected').on('value', (snap) => {
  browserOfflineSince = snap.val() === true ? null : (browserOfflineSince || Date.now());
  updateConnectionStatus();
});

function setBaseStatus(text) {
  baseStatusText = text;
  updateConnectionStatus();
}

function formatSilence(ms) {
  const sec = Math.round(ms / 1000);
  return sec < 60 ? `${sec}초` : `${Math.floor(sec / 60)}분`;
}

function updateConnectionStatus() {
  if (baseStatusText === null) return;

  let warning = null;
  // 브라우저 자체가 끊겼으면 앱 탓이 아니므로 그걸 먼저 알린다(데이터가 안 오는 건 당연하니까).
  if (browserOfflineSince !== null && Date.now() - browserOfflineSince > OFFLINE_WARN_AFTER_MS) {
    warning = '⚠ 인터넷 연결 끊김';
  } else if (serverOffsetKnown && lastData && lastData.isPlaying &&
             lastData.lyricsStatus !== 'none' && lastData.updatedAt) {
    const silentMs = Date.now() + serverOffsetMs - lastData.updatedAt;
    if (silentMs > APP_SILENT_AFTER_MS) warning = `⚠ 폰 앱 응답 없음 · ${formatSilence(silentMs)}`;
  }

  statusEl.classList.toggle('stale', warning !== null);
  statusEl.textContent = warning !== null ? warning : baseStatusText;
}
setInterval(updateConnectionStatus, 1000);

function applyPosition(data) {
  isPlaying = !!data.isPlaying;
  let position = data.positionMs || 0;
  if (isPlaying && data.positionSampledAt) {
    const elapsed = Date.now() + serverOffsetMs - data.positionSampledAt;
    // 시계 이상으로 말도 안 되는 값이 나오면(음수/10분 초과) 보정하지 않는다.
    if (elapsed > 0 && elapsed < 10 * 60 * 1000) position += elapsed;
  }
  basePositionMs = position;
  baseReceivedAt = Date.now();
}

function render(data) {
  const nothingPlaying = data.lyricsStatus === 'none';
  lastData = data;
  setBaseStatus(nothingPlaying ? '재생 중인 곡이 없어요' : (data.isPlaying ? '재생 중' : '일시정지'));
  titleEl.textContent = nothingPlaying ? '-' : (data.title || '-');
  artistEl.textContent = nothingPlaying ? '' : (data.artist || '');
  lyricsSourceEl.textContent = nothingPlaying ? '' : (data.lyricsSource ? `가사 출처: ${data.lyricsSource}` : '');

  if (data.albumArtUrl) {
    albumArtEl.src = data.albumArtUrl;
    albumArtEl.classList.add('visible');
  } else {
    albumArtEl.removeAttribute('src');
    albumArtEl.classList.remove('visible');
  }

  applyPosition(data);

  const trackKey = (data.title || '') + '|' + (data.artist || '');
  // 제목/가수가 같아도 "검색 중 -> 완료"나 가사 소스 전환으로 가사 내용 자체가
  // 바뀔 수 있어서, 곡이 바뀐 건지와 별개로 가사 쪽 지문도 같이 봐야 한다.
  const lyricsKey = lyricsFingerprint(data);

  if (trackKey !== lastTrackKey || lyricsKey !== lastLyricsKey) {
    lastTrackKey = trackKey;
    lastLyricsKey = lyricsKey;
    syncedLyrics = data.syncedLyrics ? Object.values(data.syncedLyrics) : [];
    // 목록을 새로 그리면 DOM에 .active가 하나도 없다. 이전 가사의 하이라이트
    // 위치를 기억한 채로 두면 tick()이 "이미 그 줄이 하이라이트됨"이라고
    // 착각해서 새 가사에 하이라이트를 안 붙이므로 항상 잊는다.
    activeIndex = -1;
    renderLyricsList(data);
  }
}

// 가사가 "다시 그려져야 하는지" 판단하는 지문. 줄 수만 보면 줄 수가 같은 다른
// 소스로 바꿨을 때 새 가사를 안 그리므로 소스 이름과 첫/끝 줄 내용도 넣는다.
function lyricsFingerprint(data) {
  const synced = data.syncedLyrics ? Object.values(data.syncedLyrics) : [];
  return [
    data.lyricsStatus || '',
    data.lyricsSource || '',
    synced.length,
    synced.length ? synced[0].text : '',
    synced.length ? synced[synced.length - 1].text : '',
    data.plainLyrics ? data.plainLyrics.length : 0
  ].join('|');
}

function renderLyricsList(data) {
  lyricsBox.innerHTML = '';
  if (syncedLyrics.length > 0) {
    syncedLyrics.forEach((line, i) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.id = 'line-' + i;
      div.textContent = line.text || ' ';
      lyricsBox.appendChild(div);
    });
    addBottomSpacer();
  } else if (data.plainLyrics) {
    data.plainLyrics.split('\n').forEach((text) => {
      const div = document.createElement('div');
      div.className = 'line';
      div.textContent = text || ' ';
      lyricsBox.appendChild(div);
    });
  } else if (data.lyricsStatus === 'searching') {
    lyricsBox.innerHTML = '<div class="line">가사 검색 중...</div>';
  } else if (data.lyricsStatus === 'none') {
    lyricsBox.innerHTML = '';
  } else {
    lyricsBox.innerHTML = '<div class="line">가사를 찾을 수 없어요</div>';
  }
}

// 하이라이트 줄이 가사 박스 높이의 이 비율 지점에 오도록 스크롤
const ACTIVE_LINE_OFFSET_RATIO = 0.4;

// instant: 목록이 방금 새로 그려진 직후(곡/가사 소스 전환, 페이지 처음 열기)에는
// 맨 위에서부터 천천히 내려오지 않고 바로 해당 줄로 맞춘다.
function scrollToLine(el, instant) {
  const targetOffset = lyricsBox.clientHeight * ACTIVE_LINE_OFFSET_RATIO;
  const scrollTop = el.offsetTop - targetOffset + el.offsetHeight / 2;
  lyricsBox.scrollTo({ top: scrollTop, behavior: instant ? 'instant' : 'smooth' });
}

// 마지막 줄들은 스크롤할 콘텐츠가 부족해서 하이라이트 지점(위 비율)까지
// 끌어올릴 수 없고, 그만큼 위로 밀려 올라가 보인다. 실제 콘텐츠 아래에
// 빈 여백을 더해서 마지막 줄도 같은 위치에 고정되도록 한다.
function addBottomSpacer() {
  const spacer = document.createElement('div');
  spacer.style.height = (lyricsBox.clientHeight * (1 - ACTIVE_LINE_OFFSET_RATIO)) + 'px';
  lyricsBox.appendChild(spacer);
}

function estimatedPositionMs() {
  const base = isPlaying ? basePositionMs + (Date.now() - baseReceivedAt) : basePositionMs;
  return base + syncOffsetMs;
}

function tick() {
  if (syncedLyrics.length > 0) {
    const position = estimatedPositionMs();
    let idx = -1;
    for (let i = 0; i < syncedLyrics.length; i++) {
      if (syncedLyrics[i].timeMs <= position) idx = i;
      else break;
    }
    if (idx !== activeIndex) {
      const justRendered = activeIndex === -1;
      activeIndex = idx;
      document.querySelectorAll('.line.active').forEach((el) => el.classList.remove('active'));
      if (idx >= 0) {
        const el = document.getElementById('line-' + idx);
        if (el) {
          el.classList.add('active');
          scrollToLine(el, justRendered);
        }
      }
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const savedCode = localStorage.getItem('pairingCode');
const paramCode = new URLSearchParams(location.search).get('code');
const initialCode = paramCode || savedCode;
if (initialCode) {
  document.getElementById('codeInput').value = initialCode;
  startWithCode(initialCode);
}
</script>
</body>
</html>
